# Example unit. Prefer: ./scripts/setup.sh --supervisor
# which writes ~/.agent-mesh/agent-mesh-node.conf from agent-mesh-node.conf.in

[program:agent-mesh-node]
command=/bin/bash -lc 'set -a; [ -f %(ENV_HOME)s/.agent-mesh/node.env ] && . %(ENV_HOME)s/.agent-mesh/node.env; set +a; exec %(ENV_HOME)s/.local/bin/mesh-node -listen 0.0.0.0:7700 -relay "${MESH_RELAY:-http://127.0.0.1:8443}"'
directory=%(ENV_HOME)s
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/.agent-mesh/supervisor.out.log
stderr_logfile=%(ENV_HOME)s/.agent-mesh/supervisor.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
