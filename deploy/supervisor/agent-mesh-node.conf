[program:agent-mesh-node]
command=/bin/bash -lc 'set -a; [ -f /home/ydl/.agent-mesh/node.env ] && . /home/ydl/.agent-mesh/node.env; set +a; exec /home/newdisk/work/agent-coding-tools/bin/node -listen 0.0.0.0:7700 -relay https://mesh.ranchulin.com'
directory=/home/newdisk/work/agent-coding-tools
user=ydl
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/home/ydl",DISPLAY=":0",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/home/ydl/.agent-mesh/supervisor.out.log
stderr_logfile=/home/ydl/.agent-mesh/supervisor.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
