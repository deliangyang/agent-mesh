<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Mesh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <header>
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>Console</h1>
        <p class="kicker">AGENT MESH</p>
      </div>
    </div>
    <dl class="meta">
      <div><dt>Node</dt><dd id="nodeName">—</dd></div>
      <div><dt>Identity</dt><dd id="nodeId" class="mono">—</dd></div>
      <div><dt>OpenAI</dt><dd id="openaiUrl" class="mono">—</dd></div>
    </dl>
    <form id="relayForm" class="relay">
      <label>Relay</label>
      <input id="relayInput" type="text" placeholder="https://mesh.example.com" />
      <input id="relayPassword" type="password" placeholder="shared password" />
      <input id="advertiseInput" type="text" placeholder="public URL http://LAN-IP:7700" />
      <button type="submit">Connect</button>
      <span id="relayState" class="relay-state">offline</span>
    </form>
  </header>

  <main>
    <aside class="engines">
      <h2>Engines</h2>
      <ul id="engineList"></ul>
    </aside>

    <section class="board">
      <div class="toolbar">
        <h2>Sessions</h2>
        <label class="chk"><input id="showAll" type="checkbox" /> include history</label>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Engine</th>
              <th>Title</th>
              <th>Session</th>
              <th>Workspace</th>
            </tr>
          </thead>
          <tbody id="sessionBody"></tbody>
        </table>
      </div>
    </section>

    <aside class="inspect">
      <div class="panel">
        <h2>Models</h2>
        <ul id="modelList" class="models"></ul>
      </div>
      <div class="panel">
        <h2>Workspaces</h2>
        <ul id="dirList" class="models"></ul>
      </div>
      <div class="panel stream-panel">
        <h2>Listen <span id="streamHint">OpenAI chunk</span></h2>
        <pre id="stream"></pre>
      </div>
    </aside>
  </main>

  <footer>
    <select id="sendEngine"></select>
    <input id="cwdInput" type="text" placeholder="workspace (new session)" />
    <textarea id="prompt" rows="2" placeholder="Follow up on the selected session, or start a new one"></textarea>
    <button id="sendBtn" type="button">Send</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
