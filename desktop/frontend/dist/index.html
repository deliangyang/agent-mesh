<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Mesh</title>
  <script>
    (function () {
      var zh = ((navigator.language || "").toLowerCase().indexOf("zh") === 0);
      document.documentElement.lang = zh ? "zh-CN" : "en";
      window.__meshSplash = zh ? "正在启动 Agent Mesh…" : "Starting Agent Mesh…";
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1c1712;
      color: #e8dfd2;
      font: 14px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: center;
    }
    p { opacity: 0.72; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <p id="splash">Starting Agent Mesh…</p>
  <script>
    (function () {
      var el = document.getElementById("splash");
      if (el && window.__meshSplash) el.textContent = window.__meshSplash;
    })();
  </script>
</body>
</html>
