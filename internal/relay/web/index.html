<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E2B27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mesh" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Chat · Agent Mesh</title>
    <script>
      try {
        if (localStorage.getItem("mesh.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
      (function () {
        var pref = "";
        try { pref = localStorage.getItem("mesh.locale") || ""; } catch (e) {}
        var lang = (pref === "en" || pref === "zh-CN")
          ? pref
          : ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en");
        document.documentElement.lang = lang === "zh-CN" ? "zh-CN" : "en";
        if (lang === "zh-CN") {
          try { document.title = "聊天 · Agent Mesh"; } catch (e) {}
          document.documentElement.style.setProperty("--mesh-boot", '"正在打开聊天…"');
        } else {
          document.documentElement.style.setProperty("--mesh-boot", '"Opening chat…"');
        }
      })();
      (function () {
        var opt = { capture: true, passive: false };
        function pinch(e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
          if (typeof e.scale === "number" && e.scale !== 1) e.preventDefault();
        }
        function block(e) { e.preventDefault(); }
        document.addEventListener("touchstart", pinch, opt);
        document.addEventListener("touchmove", pinch, opt);
        document.addEventListener("gesturestart", block, opt);
        document.addEventListener("gesturechange", block, opt);
        document.addEventListener("gestureend", block, opt);
      })();
    </script>
    <style>
      html, body, #app { height: 100%; margin: 0; background: #F1F3F2; color: #1E2B27; touch-action: pan-x pan-y; }
      html.dark, html.dark body, html.dark #app { background: #121816; color: #E3EBE6; }
      #app:empty { display: flex; align-items: flex-end; justify-content: flex-start; padding: 12vh 10vw; color: #5E6D67; font: 14px/1.4 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      html.dark #app:empty { color: #8A9A93; }
      #app:empty::after { content: var(--mesh-boot, "Opening chat…"); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
